name: Validate production manifests

on:
  push:
    branches:
      - "main"
      - "feat/**"
  pull_request:
    branches:
      - "main"
      - "feat/video-pipeline-foundation"
      - "feat/render-qa-inspector"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/validate_project.py projects/the-clever-little-rabbits/project.json
          python scripts/validate_project.py projects/mother-magpie/project.json
